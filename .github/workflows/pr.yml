name: Build and run tests

'on':
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: npm ci
      - name: Run lint 
        run: npm run lint
      - name: Run build
        run: npm run build
      - name: Run test
        run: npm run test
